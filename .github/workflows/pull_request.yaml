name: "Pull Request"
on: pull_request

jobs:
  docs:
    name: "Ensure 'make docs' has been run"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # Put terraform on PATH so tfplugindocs doesn't download it via hc-install,
      # whose embedded HashiCorp PGP key has expired ("openpgp: key expired").
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Generate Docs
        run: |
          export PATH=$PATH:/home/runner/go/bin
          make docs
      - name: Validate No Changes
        run: |
          git diff --exit-code
  gofmt:
    name: "Ensure 'make fmt' has been run"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run gofmt
        run: |
          go fmt
      - name: Validate No Changes
        run: |
          git diff --exit-code
